hooks:
  - scripts/mkdocs_hooks.py

plugins:
  # \u200b: jieba marks Chinese word boundaries with zero-width spaces when it
  # builds the search index. JavaScript's \s does not match U+200B, so without
  # it here a whole Chinese phrase is indexed as a single token.
  - search:
      separator: '[\s\u200b\-]+'
  - mermaid2
  - i18n:
      # Set by the build orchestration to build one self-contained locale at a
      # time, each with its own search index. Unset builds every locale into a
      # single tree that shares one index. See scripts/build_site.py.
      build_only_locale: !ENV [BUILD_ONLY_LOCALE, null]
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fi
          name: Suomi
          build: true
          site_name: "Pythonin O-notaatio: aika- ja tilavaativuus"
          site_description: Kattava dokumentaatio Pythonin sisäänrakennettujen tyyppien ja standardikirjaston aika- ja tilavaativuuksista
          nav_translations:
            Home: Etusivu
            Overview: Yleiskatsaus
            Builtins: Sisäänrakennetut
            Standard Library: Standardikirjasto
            Implementations: Toteutukset
            Versions: Versiot
            Lists: Listat
            Dictionaries: Sanakirjat
            Sets: Joukot
            Tuples: Monikot
            Strings: Merkkijonot
            Bytes & Bytearray: Tavut ja tavutaulukot
            Range: Lukualue
            Integer: Kokonaisluku
            Float: Liukuluku
            Boolean: Totuusarvo
            Enumerate: Numerointi
            Length: Pituus
            Maximum: Suurin
            Minimum: Pienin
            Sum: Summa
            Sorted: Järjestäminen
            Regular Expressions: Säännölliset lausekkeet
        - locale: zh
          name: 简体中文
          build: true
          site_name: "Python 大 O 表示法：时间与空间复杂度"
          site_description: Python 内置类型与标准库操作的时间和空间复杂度完整参考
          nav_translations:
            Home: 首页
            Overview: 概览
            Builtins: 内置
            Standard Library: 标准库
            Implementations: 实现
            Versions: 版本
            Lists: 列表
            Dictionaries: 字典
            Sets: 集合
            Tuples: 元组
            Strings: 字符串
            Bytes & Bytearray: 字节与字节数组
            Range: 范围
            Integer: 整数
            Float: 浮点数
            Boolean: 布尔值
            Length: 长度
            Maximum: 最大值
            Memoryview: 内存视图
            Minimum: 最小值
            Sum: 求和
            Sorted: 排序
            Regular Expressions: 正则表达式
        - locale: ja
          name: 日本語
          build: true
          site_name: "Python の O 記法：時間計算量と空間計算量"
          site_description: Python の組み込み型と標準ライブラリの操作における時間計算量と空間計算量の完全リファレンス
          nav_translations:
            Home: ホーム
            Overview: 概要
            Builtins: 組み込み
            Standard Library: 標準ライブラリ
            Implementations: 実装
            Versions: バージョン
            Lists: リスト
            Dictionaries: 辞書
            Sets: 集合
            Tuples: タプル
            Strings: 文字列
            Bytes & Bytearray: バイト列とバイト配列
            Range: 範囲
            Integer: 整数
            Float: 浮動小数点数
            Boolean: 真偽値
            Length: 長さ
            Maximum: 最大値
            Minimum: 最小値
            Sum: 合計
            Sorted: ソート
            Regular Expressions: 正規表現

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode

extra:
  analytics:
    provider: google
    property: G-7QJ6R1ZTRV
extra_css:
