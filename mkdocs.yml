site_name: "Python Big-O: Time & Space Complexity"
site_description: Comprehensive documentation of time and space complexity for Python built-ins and standard library
site_url: https://pythoncomplexity.com
repo_url: https://github.com/heikkitoivonen/python-time-space-complexity
repo_name: GitHub

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - announce.dismiss
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.path
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: Switch to light mode

# The theme's custom_dir lives inside docs/, so mkdocs would otherwise copy the
# Jinja templates there into the build and serve them as pages - fragments with
# no <html> element, no language, and unrendered {% %} markup, one copy per
# locale. Excluding them from the docs tree does not affect custom_dir: theme
# templates are resolved through the Jinja loader, not the file collection.
exclude_docs: |
  overrides/

