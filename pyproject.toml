[project]
name = "python-time-space-complexity"
version = "0.8.0"
description = "Comprehensive documentation of time and space complexity for Python built-ins and standard library"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Python Complexity Contributors" }
]
requires-python = ">=3.10"
keywords = [
    "big-o",
    "complexity",
    "time-complexity",
    "space-complexity",
    "python",
    "documentation",
    "performance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development",
]

dependencies = [
    "jieba>=0.42.1",
    "mkdocs",
    "mkdocs-material",
    "mkdocs-mermaid2-plugin",
    "mkdocs-static-i18n>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyyaml",
    "pyright",
]

[project.urls]
Homepage = "https://github.com/heikkitoivonen/python-time-space-complexity"
Documentation = "https://pythoncomplexity.com"
Repository = "https://github.com/heikkitoivonen/python-time-space-complexity.git"
Issues = "https://github.com/heikkitoivonen/python-time-space-complexity/issues"

# uv dependency groups configuration
[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyyaml",
    "pyright",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "site",
    ".pytest_cache",
    ".ruff_cache",
    # `ruff format` reformats Python code blocks inside Markdown. Doc code
    # blocks must stay byte-identical to their translations, so formatting one
    # marks every translation of that page stale - see
    # scripts/validate_translations.py. `ruff check` ignores Markdown anyway.
    "*.md",
]
# Honour the excludes above even when a path is named explicitly, so an editor
# formatting a Markdown file on save cannot bypass them either.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["python_time_space_complexity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# -ra: a claim that skipped is a claim nobody checked. The CVE-2026-3276
# normalization test skips on an unpatched interpreter, and a bare "s" in
# the progress line is too easy to read as a pass.
addopts = "-v --tb=short --strict-markers -ra"
markers = [
    # Tests that settle a claim with a stopwatch rather than by observation.
    # They are correct but not reliable on a shared CI runner, so they do not
    # gate deployment -- see the `timing` job in .github/workflows/deploy.yml.
    # A test earns this marker by reaching time.perf_counter(), directly or
    # through a helper; nothing else belongs here. Prefer removing the marker
    # by rewriting the test to observe (a call counter, an identity check)
    # over leaving it in the non-blocking job forever.
    "timing: settles its claim by measuring elapsed time",
]
