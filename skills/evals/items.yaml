# Recall items for the python-complexity skill evaluation.
#
# Each item asks for the time and space bound of one operation. The answer key
# comes from the bundled reference page and `row` quotes the table row it rests
# on; tests/test_skill_eval.py fails when that text leaves the page.
#
# stratum: common - chosen from the PyPI usage scan (usage.json); `usage` names
#                   the scan entry that selected it
#          tail   - less familiar operations whose bound carries a qualifier
# case:    the bound asked for: worst, average or amortized
# accept:  equivalent spellings the deterministic grader recognises; the LLM
#          judge decides any other spelling against `key`
#
# Keys treat every size variable as at least 1, the usual convention, so an
# additive constant or lower-order term such as O(i + 1) or O(n·N + n) is
# equivalent to O(i) or O(n·N).

- id: list-membership
  stratum: common
  usage: op:in
  pilot: true
  operation: "`x in lst`, where `lst` is a list"
  variables: "n = len(lst)"
  case: worst
  time: {key: "O(n)"}
  space: {key: "O(1)"}
  source: {page: docs/builtins/list.md, row: "| `x in l` (membership) | O(n) | O(1) |"}

