name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      # Everything except the stopwatch tests. Those are correct but not
      # reliable on a shared runner, and a mis-timed measurement is not a
      # reason to stop publishing documentation -- three deploys were lost
      # that way. They run in the `timing` job below, which does not gate
      # the deploy. `make check` still runs the whole suite before a commit.
      - name: Run tests
        run: uv run pytest -m "not timing"

      - name: Build site
        # Not a plain `mkdocs build`: that puts every locale in one tree
        # sharing a single search index, which makes search cross-language.
        # This builds each locale as its own self-contained site.
        run: uv run python scripts/build_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  # Reports, but deliberately does not gate: `deploy` needs `build` only.
  # A red run here means a complexity claim needs looking at -- check whether
  # the measurement missed by a hair (noise) or by a wide margin (the claim).
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run timing tests
        run: uv run pytest -m timing

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
