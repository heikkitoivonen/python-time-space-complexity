name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Always a uv-managed interpreter. Otherwise uv picks up whatever Python the
# runner has that matches .python-version - Homebrew's on macOS, which has no
# tkinter, links the system libedit and moves the stdlib behind a symlink.
env:
  UV_PYTHON_PREFERENCE: only-managed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Everything that does not depend on the operating system runs once, here.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: uv sync

      - name: Lint
        # `ruff check` and `ruff format` disagree about different things, and
        # only the first was enforced -- four files had drifted unnoticed.
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Check documentation coverage on newest supported Python
        # Its own environment: `uv run --python` replaces `.venv`, which would
        # hand the site build an interpreter no earlier step exercised.
        env:
          UV_PROJECT_ENVIRONMENT: .venv-newest
        run: |
          uv run --python 3.14.7 --frozen pytest tests/test_documentation_coverage.py
          uv run --python 3.14.7 --frozen python scripts/audit_documentation.py --check

      - name: Build site
        # Not a plain `mkdocs build`: that puts every locale in one tree
        # sharing a single search index, which makes search cross-language.
        # This builds each locale as its own self-contained site.
        run: uv run python scripts/build_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'
          include-hidden-files: true

  # The suite on each operating system. A test with no platform guard must
  # pass on all three, so a failure on any one of them fails the run.
  test:
    needs: checks
    # A hang otherwise holds the runner for GitHub's six-hour default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            missing: ""
          # Its interpreter has no C-library gettext, and links the system
          # libedit, which lacks append_history.
          - os: macos-latest
            missing: "libintl readline-append-history"
          # Hosted Windows runners have no sound card, the Windows C runtime
          # has no C.UTF-8 locale, and the runner's token holds the restore
          # privilege enabled.
          - os: windows-latest
            missing: "audio c-utf8-locale unprivileged-token"
    runs-on: ${{ matrix.os }}
    env:
      # What this runner lacks. tests/conftest.py fails a skip for any other
      # missing capability, because there it would hide a test that should run.
      COMPLEXITY_MISSING_CAPABILITIES: ${{ matrix.missing }}
      # The curses tests need a terminfo entry, and a job has no TERM.
      TERM: xterm-256color
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: uv sync

      # Everything except the stopwatch tests. Those are correct but not
      # reliable on a shared runner, and a mis-timed measurement is not a
      # reason to stop publishing documentation -- three deploys were lost
      # that way. They run in the `timing` job below, which does not gate
      # the deploy. `make check` still runs the whole suite before a commit.
      - name: Run tests
        run: |
          uv run pytest -m "not timing and not serial" -n auto --dist=loadfile
          uv run pytest -m "serial and not timing" -n 0

  # Reports, but deliberately does not gate: `deploy` does not need it.
  # A red run here means a complexity claim needs looking at -- check whether
  # the measurement missed by a hair (noise) or by a wide margin (the claim).
  timing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported line, at or above its CVE-2026-3276 fix release,
        # so the normalization assertion runs on each version.
        python: ["3.10.21", "3.11.16", "3.12.14", "3.13.14", "3.14.7"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      # Makes that skip a failure here, so a pin that drifts below a fix
      # release cannot quietly put this job back to verifying nothing.
      # Local runs still skip, and `make check` stays green off a patch.
      COMPLEXITY_REQUIRE_PATCHED_PYTHON: "1"
      # The runner lacks nothing a timing test needs; see tests/conftest.py.
      COMPLEXITY_MISSING_CAPABILITIES: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # An older pinned uv resolves against a build index predating the
          # fix releases and cannot fetch the matrix entries.
          version: "latest"
          enable-cache: false

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync

      - name: Run timing tests
        run: uv run pytest -m timing -n 0

  deploy:
    # Serialize publication without allowing a stuck deploy to suppress the
    # build and timing checks for later pushes.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [checks, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
